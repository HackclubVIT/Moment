[project]
name = "meeting-agent"
version = "0.1.0"
description = "Agentic AI bot that joins meetings, records audio, transcribes speech, and writes Minutes of Meeting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Playwright drives Chromium to join meetings. Install with:
#   uv sync --extra meeting
#   uv run playwright install chromium
meeting = ["playwright>=1.45"]

# Local (offline) speech-to-text. Install with:
#   uv sync --extra local-stt
local-stt = ["faster-whisper>=1.0"]

[project.scripts]
meeting-agent = "meeting_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_agent"]
